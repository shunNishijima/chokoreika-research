<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>朝ご飯会 受付</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#fbfaf6;--surface:#fff;--text:#111;--muted:#444;--border:#888;--accent:#1f4e8c;--accent-text:#fff;--ok:#1d6b46;--warn:#8a1c1c;--sub:#eceae3}
@media (prefers-color-scheme: dark){:root{--bg:#121417;--surface:#1d2024;--text:#f2f2f0;--muted:#c4c7cc;--border:#9aa0a6;--accent:#8fb0e0;--accent-text:#111;--ok:#6fd3a0;--warn:#ff9b9b;--sub:#2a2e33}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:22px;line-height:1.6}
main{max-width:720px;margin:0 auto;padding:16px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.top .ev{font-size:.8rem;color:var(--muted)}
h1{font-size:1.6rem;margin:8px 0 16px;line-height:1.35}
h2{font-size:1.25rem;margin:20px 0 10px}
p{margin:0 0 12px}
.q{font-size:1.5rem;font-weight:700;margin:8px 0 6px;line-height:1.4}
.hint{color:var(--muted);font-size:1rem;margin-bottom:14px}
.btns{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:560px){.btns.two{grid-template-columns:1fr 1fr}}
button,.btn{font:inherit;font-size:1.3rem;font-weight:700;min-height:76px;padding:12px 16px;border-radius:14px;border:3px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;width:100%;text-align:center;touch-action:manipulation}
button:active{transform:scale(.98)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
button.big{min-height:120px;font-size:1.6rem}
button.small{min-height:56px;font-size:1rem;font-weight:500;width:auto;padding:8px 16px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.row>*{flex:1 1 160px}
.progress{font-size:1rem;color:var(--muted)}
.done{text-align:center;padding:12px 0}
.done .mark{font-size:3rem;line-height:1;color:var(--ok);font-weight:700}
.num{font-size:3.6rem;font-weight:700;letter-spacing:.12em;margin:4px 0}
.card{border:3px dashed var(--border);border-radius:16px;padding:16px;margin:12px auto;max-width:360px;background:#fff;color:#111;text-align:center}
.card .t{font-size:1rem;font-weight:700}
.card #qr{display:inline-block;margin:8px auto;background:#fff;padding:8px}
.card .next{font-size:1.1rem;font-weight:700;border-top:1px solid #999;margin-top:8px;padding-top:6px}
.msg{padding:14px 16px;border-radius:12px;border:3px solid var(--border);margin:12px 0;font-weight:700}
.msg.warn{border-color:var(--warn);color:var(--warn)}
.msg.ok{border-color:var(--ok);color:var(--ok)}
.display{font-size:3rem;font-weight:700;letter-spacing:.2em;text-align:center;border:3px solid var(--border);border-radius:14px;padding:8px;min-height:84px;background:var(--surface)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.keypad button{font-size:2rem;min-height:80px}
#reader{width:100%;max-width:420px;margin:12px auto}
label{display:block;font-size:1rem;font-weight:700;margin:12px 0 4px}
input,select,textarea{font:inherit;font-size:1.05rem;width:100%;padding:10px 12px;border-radius:10px;border:2px solid var(--border);background:var(--surface);color:var(--text)}
textarea{min-height:140px}
table{border-collapse:collapse;width:100%;font-size:1rem}
th,td{border-bottom:1px solid var(--border);padding:6px 4px;text-align:left;vertical-align:middle}
td select{font-size:.95rem;padding:6px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.tabs button{min-height:52px;font-size:1rem;width:auto;flex:1 1 auto}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:10px 0}
.stat{border:2px solid var(--border);border-radius:12px;padding:8px 10px;background:var(--surface)}
.stat b{display:block;font-size:1.8rem;line-height:1.2}
.stat span{font-size:.9rem;color:var(--muted)}
.kv{font-size:1rem;margin:4px 0}
.note{font-size:.9rem;color:var(--muted);border-top:1px solid var(--border);margin-top:28px;padding-top:10px}
.tw{overflow-x:auto}
@media print{body *{visibility:hidden}.card,.card *{visibility:visible}.card{position:absolute;left:0;top:0;border:2px dashed #000}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
