<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ネコ受付</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#fff8ec;--surface:#fff;--text:#2b2118;--muted:#5c4d40;--border:#8a7663;--accent:#c4552b;--accent-text:#fff;--ok:#1d6b46;--warn:#8a1c1c;--cat1:#f2a65a;--cat2:#6b6b6b;--cat3:#f4ede2;--line:#3a2b20;--pink:#f3a0a8}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;font-size:24px;line-height:1.6;overflow-x:hidden;-webkit-user-select:none;user-select:none}
main{min-height:100%;max-width:820px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column}
.top{font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.q{font-size:2rem;font-weight:700;line-height:1.4;margin:24px 0 8px}
.hint{color:var(--muted);font-size:1.1rem;margin:0 0 18px}
.btns{display:grid;gap:16px;grid-template-columns:1fr}
.btns.two{grid-template-columns:1fr 1fr}
button{font:inherit;font-size:1.6rem;font-weight:700;min-height:96px;padding:12px 16px;border-radius:22px;border:3px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;width:100%;touch-action:manipulation;display:flex;align-items:center;justify-content:center;gap:16px}
button:active{transform:scale(.97)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
button.sub{min-height:64px;font-size:1.15rem;font-weight:500}
button.tall{min-height:180px;flex-direction:column;gap:6px}
button.tall svg{width:110px;height:110px}
.mood svg{width:64px;height:64px;flex:none}
.mood{justify-content:flex-start;padding-left:28px}
.row{display:flex;gap:12px;margin-top:auto;padding-top:28px}
.row>*{flex:1}
input,select{font:inherit;font-size:1.6rem;width:100%;padding:14px 16px;border-radius:16px;border:3px solid var(--border);background:var(--surface);color:var(--text)}
input:focus,select:focus{outline:4px solid var(--accent);outline-offset:2px}
.birth{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:1.6rem;font-weight:700}
.birth select{width:auto;min-width:110px}
.msg{border:3px solid var(--warn);color:var(--warn);border-radius:14px;padding:10px 14px;margin:12px 0;font-size:1.2rem;background:var(--surface)}
.names{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));max-height:52vh;overflow:auto;padding:4px}
.names button{min-height:80px;font-size:1.4rem}
.trivia{background:var(--surface);border:3px dashed var(--border);border-radius:24px;padding:24px;font-size:1.6rem;font-weight:700;white-space:pre-line;text-align:center;margin:12px 0}
.center{text-align:center}

/* アイドリング画面 */
#idle{position:fixed;inset:0;background:var(--bg);overflow:hidden;cursor:pointer}
#idle .floor{position:absolute;left:0;right:0;bottom:0;height:22vh;background:#f3e3c8;border-top:4px solid #e6cfa8}
#idle .title{position:absolute;top:8vh;left:0;right:0;text-align:center}
#idle .title .club{font-size:1.2rem;color:var(--muted)}
#idle .title .tap{font-size:2.6rem;font-weight:700;animation:pulse 2s ease-in-out infinite}
#idle .hero{position:absolute;left:50%;top:34vh;width:min(42vw,260px);transform:translateX(-50%)}
#idle .hero .bob{animation:bob 3s ease-in-out infinite}
.walker{position:absolute;width:150px;height:110px;animation:wander linear infinite}
.walker svg{width:100%;height:100%}
.sleeper{position:absolute;width:170px;height:100px}
.sitter{position:absolute;width:120px;height:130px}
.zzz{position:absolute;font-weight:700;color:var(--muted);font-size:1.4rem;opacity:0;animation:zzz 3s ease-out infinite}
.zzz.b{animation-delay:1s}.zzz.c{animation-delay:2s}
#op{position:fixed;right:8px;bottom:8px;width:auto;min-height:44px;font-size:.8rem;font-weight:500;padding:6px 12px;opacity:.55;z-index:5;border-width:2px}
#op .fill{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);width:0}
#op.holding .fill{transition:width 1.5s linear;width:100%}

/* ネコのアニメーション */
.leg{transform-box:fill-box;transform-origin:50% 0;animation:leg .5s ease-in-out infinite alternate}
.leg.b{animation-direction:alternate-reverse}
.tail{transform-box:fill-box;transform-origin:100% 100%;animation:wag 1.2s ease-in-out infinite alternate}
.breath{transform-box:fill-box;transform-origin:50% 100%;animation:breath 3s ease-in-out infinite}
.yawn{transform-box:fill-box;transform-origin:50% 0;animation:yawn 6s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4s infinite}
.yawneyes{transform-box:fill-box;transform-origin:50% 50%;animation:yawneyes 6s ease-in-out infinite}
.wave{transform-box:fill-box;transform-origin:50% 100%;animation:wave .6s ease-in-out infinite alternate}
.jump{animation:jump 1.2s ease-in-out infinite}
@keyframes leg{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
@keyframes wag{from{transform:rotate(-8deg)}to{transform:rotate(14deg)}}
@keyframes breath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,1.08)}}
@keyframes yawn{0%,55%,85%,100%{transform:scaleY(0)}62%,78%{transform:scaleY(1)}}
@keyframes yawneyes{0%,55%,85%,100%{transform:scaleY(1)}62%,78%{transform:scaleY(.15)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes wave{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-18px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes zzz{0%{opacity:0;transform:translate(0,0) scale(.7)}30%{opacity:1}100%{opacity:0;transform:translate(26px,-60px) scale(1.2)}}
@keyframes wander{
  0%{transform:translateX(-170px) scaleX(1)}
  46%{transform:translateX(calc(100vw + 20px)) scaleX(1)}
  50%{transform:translateX(calc(100vw + 20px)) scaleX(-1)}
  96%{transform:translateX(-170px) scaleX(-1)}
  100%{transform:translateX(-170px) scaleX(1)}
}

/* 運営画面 */
.admin{font-size:1.1rem}
.admin h1{font-size:1.6rem;margin:8px 0 12px}
.admin h2{font-size:1.25rem;margin:20px 0 8px}
.admin label{display:block;font-weight:700;margin:14px 0 4px}
.admin input,.admin select{font-size:1.2rem;padding:10px 12px}
.admin button{min-height:64px;font-size:1.2rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips button{width:auto;min-height:48px;font-size:1rem;font-weight:500;padding:6px 14px;border-width:2px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.tabs button{min-height:52px;font-size:1rem;width:auto;flex:1 1 auto}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:10px 0}
.stat{border:2px solid var(--border);border-radius:12px;padding:8px 10px;background:var(--surface)}
.stat b{display:block;font-size:1.8rem;line-height:1.2}
.stat span{font-size:.9rem;color:var(--muted)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:1rem}
th,td{border-bottom:1px solid var(--border);padding:6px 4px;text-align:left}
.note{font-size:.9rem;color:var(--muted);margin-top:20px}

/* おわり画面 */
.bye{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:8px}
.bubble{position:relative;background:var(--surface);border:4px solid var(--line);border-radius:40px;padding:18px 34px;font-size:2.2rem;font-weight:700}
.bubble:after{content:"";position:absolute;left:50%;bottom:-22px;margin-left:-14px;border:14px solid transparent;border-top:18px solid var(--line)}
.bye svg{width:min(60vw,300px);height:auto}
@media (prefers-reduced-motion: reduce){*{animation-duration:0s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
